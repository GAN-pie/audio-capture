[package]
name = "audio-capture"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "record-wav"
path = "src/bin/record-wav.rs"

[[bin]]
name = "list-device"
path = "src/bin/list-device.rs"

[dependencies]
anyhow = "1.0"
hound = "3.5"
clap = { version = ">=4.6, <5", features = ["derive"] }
cpal = { version = "0.18.1" }
inquire = "0.9.3"
